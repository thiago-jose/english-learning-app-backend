  AudioFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/presentation/controllers/domain/audio/index.handler
      Events:
        # Handle all audio routes
        AudioProxy:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /audio/{proxy+}
            Method: ANY
        AudioRoot:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /audio
            Method: ANY
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref AudioFilesBucket
        - S3WritePolicy:
            BucketName: !Ref AudioFilesBucket
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObjectMetadata
                - s3:GetObjectAttributes
                - s3:DeleteObject
              Resource: !Sub "${AudioFilesBucket.Arn}/*"
      Environment:
        Variables:
          STORAGE_BUCKET_NAME: !Ref AudioFilesBucket
    Metadata:
      BuildMethod: makefile

  # Lambda Permissions for API Gateway
  UsersFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UsersFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayApi}/*/*"

