  AudioFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AudioFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayApi}/*/*"

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/"
    Export:
      Name: !Sub "${AWS::StackName}-ApiEndpoint"
  
  # DynamoDB Table Names
  UsersTableName:
    Description: Users DynamoDB table name
    Value: !Ref UsersTable
    Export:
      Name: !Sub "${AWS::StackName}-UsersTableName"
  
  WordsTableName:
    Description: Words DynamoDB table name
    Value: !Ref WordsTable
    Export:
      Name: !Sub "${AWS::StackName}-WordsTableName"
  
  TranscriptionsTableName:
    Description: Transcriptions DynamoDB table name
    Value: !Ref TranscriptionsTable
    Export:
      Name: !Sub "${AWS::StackName}-TranscriptionsTableName"
  
  UserProgressTableName:
    Description: User Progress DynamoDB table name
    Value: !Ref UserProgressTable
    Export:
      Name: !Sub "${AWS::StackName}-UserProgressTableName"
  
  # S3 Bucket
  AudioFilesBucketName:
    Description: S3 bucket for audio files
    Value: !Ref AudioFilesBucket
    Export:
      Name: !Sub "${AWS::StackName}-AudioFilesBucketName"
  
  # Lambda Functions
  UsersFunctionArn:
    Description: Users Lambda function ARN
    Value: !GetAtt UsersFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-UsersFunctionArn"
  
