  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UsersFunction.Arn}/invocations
        passthroughBehavior: when_no_match

components:
  securitySchemes:
    CognitoAuthorizer:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
          - Fn::GetAtt: CognitoUserPool.Arn
  
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - email
        - name
    
    Word:
      type: object
      properties:
        id:
          type: string
          format: uuid
        word:
          type: string
        meaning:
          type: string
        usageExample:
          type: string
        pronunciation:
          type: string
        difficulty:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
        category:
          type: string
        nextReviewDate:
          type: string
          format: date-time
        reviewCount:
          type: integer
        correctCount:
          type: integer
        userId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - word
        - meaning
        - usageExample
        - userId

    CreateWordRequest:
      type: object
      properties:
        word:
          type: string
        meaning:
          type: string
        usageExample:
          type: string
        pronunciation:
          type: string
        difficulty:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
        category:
          type: string
      required:
        - word
        - meaning
        - usageExample

    ProcessSpeechRequest:
      type: object
      properties:
        transcribedText:
          type: string
      required:
        - transcribedText

    ProcessSpeechResponse:
      type: object
      properties:
        success:
          type: boolean
        word:
          $ref: '#/components/schemas/Word'
        error:
          type: string
        transcribedText:
          type: string
      required:
        - success
        - transcribedText

    ReviewWordRequest:
      type: object
      properties:
        isCorrect:
          type: boolean
      required:
        - isCorrect

    Transcription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        audioUrl:
          type: string
        text:
          type: string
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED, FAILED]
        jobName:
          type: string
        speakerLabels:
          type: array
          items:
            $ref: '#/components/schemas/SpeakerLabel'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - userId
        - audioUrl
        - text
        - status

    SpeakerLabel:
      type: object
      properties:
        speaker:
          type: string
        startTime:
          type: number
        endTime:
          type: number
        items:
          type: array
          items:
            $ref: '#/components/schemas/SpeakerItem'

    SpeakerItem:
      type: object
      properties:
        start_time:
          type: string
        end_time:
          type: string
        type:
          type: string
        alternatives:
          type: array
          items:
            type: object
            properties:
              confidence:
                type: string
              content:
                type: string

    StartTranscriptionRequest:
      type: object
      properties:
        action:
          type: string
          enum: [startTranscription]
        audioFileKey:
          type: string
        languageCode:
          type: string
          default: en-US
        speakerLabels:
          type: boolean
          default: true
        maxSpeakers:
          type: integer
          default: 2
      required:
        - action
        - audioFileKey

    StartTranscriptionResponse:
      type: object
      properties:
        success:
          type: boolean
        transcription:
          $ref: '#/components/schemas/Transcription'
        message:
          type: string

    GetTranscriptionStatusRequest:
      type: object
      properties:
        action:
          type: string
          enum: [getTranscriptionStatus]
        jobName:
          type: string
      required:
        - action
        - jobName

    TranscriptionStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        jobName:
          type: string
        status:
          type: string
        transcriptionText:
          type: string
        speakerLabels:
          type: array
          items:
            $ref: '#/components/schemas/SpeakerLabel'
        creationTime:
          type: string
          format: date-time
        completionTime:
          type: string
          format: date-time

    GetUserTranscriptionsRequest:
      type: object
      properties:
        action:
          type: string
          enum: [getUserTranscriptions]
      required:
        - action

    UserTranscriptionsResponse:
      type: object
      properties:
        success:
          type: boolean
        transcriptions:
          type: array
          items:
            $ref: '#/components/schemas/Transcription'

    GenerateUploadUrlRequest:
      type: object
      properties:
        action:
          type: string
          enum: [generateUploadUrl]
        fileName:
          type: string
        contentType:
          type: string
        duration:
          type: integer
        fileSize:
          type: integer
      required:
        - action
        - fileName
        - contentType

    GenerateUploadUrlResponse:
      type: object
      properties:
        success:
          type: boolean
        audioFileKey:
          type: string
        uploadUrl:
          type: string
        expiresIn:
          type: integer
        maxFileSize:
          type: integer
        maxDuration:
          type: integer
        supportedFormats:
          type: array
          items:
            type: string

    GenerateDownloadUrlRequest:
      type: object
      properties:
        action:
          type: string
          enum: [generateDownloadUrl]
        audioFileKey:
          type: string
      required:
        - action
        - audioFileKey

    GenerateDownloadUrlResponse:
      type: object
      properties:
        success:
          type: boolean
        downloadUrl:
          type: string
        expiresIn:
          type: integer

    GetMetadataRequest:
      type: object
      properties:
        action:
          type: string
          enum: [getMetadata]
        audioFileKey:
          type: string
      required:
        - action
        - audioFileKey

    GetMetadataResponse:
      type: object
      properties:
        success:
          type: boolean
        metadata:
          type: object
          properties:
            fileName:
              type: string
            contentType:
              type: string
            size:
              type: integer
            duration:
              type: integer